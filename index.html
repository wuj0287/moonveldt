<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wwj</title>
<link rel="stylesheet" href="libs/github.min.css" id="hljs-theme">
<script src="libs/marked.min.js"></script>
<script src="libs/highlight.min.js"></script>
<script src="libs/mermaid.min.js"></script>
<link rel="stylesheet" href="libs/katex/katex.min.css">
<script src="libs/katex/katex.min.js"></script>
<script src="libs/katex/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f7f8fa; --bg3:#eceef1;
  --border:#e3e5e8; --text:#333333; --text2:#555; --muted:#999;
  --accent:#4a7df0; --accent2:#eaf0fe;
  --shadow:0 4px 16px rgba(0,0,0,.12);
}
body.dark{
  --bg:#1e2229; --bg2:#252a33; --bg3:#2d333f;
  --border:#3a4150; --text:#d6dae2; --text2:#aab1bd; --muted:#7a8190;
  --accent:#6f9bff; --accent2:#2c3547;
  --shadow:0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}

/* ============ 顶栏 ============ */
#menubar{display:flex;align-items:center;height:40px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 8px;user-select:none;flex-shrink:0;gap:2px}
.icon-btn{width:30px;height:28px;border:none;background:transparent;border-radius:5px;color:var(--text2);cursor:pointer;font-size:15px;line-height:1}
.icon-btn:hover{background:var(--bg3)}
.menu-item{padding:4px 11px;border-radius:5px;cursor:pointer;color:var(--text2);font-size:13px;position:relative}
.menu-item:hover,.menu-item.open{background:var(--bg3)}
#app-title{font-weight:600;color:var(--muted);margin-left:8px;font-size:13px;letter-spacing:.5px}
.spacer{flex:1}

/* 下拉菜单 */
.dropdown{position:absolute;top:30px;left:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:180px;padding:5px;display:none;z-index:100}
.menu-item.open .dropdown{display:block}
.dd-item{padding:7px 12px;border-radius:5px;cursor:pointer;color:var(--text);font-size:13px;display:flex;justify-content:space-between;gap:16px;white-space:nowrap}
.dd-item:hover{background:var(--accent2)}
.dd-item kbd{color:var(--muted);font-family:inherit;font-size:11px}
.dd-sep{height:1px;background:var(--border);margin:4px 6px}

/* ============ 主体 ============ */
#main{flex:1;display:flex;min-height:0}
#sidebar{width:230px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .18s}
#sidebar.hidden{margin-left:-230px}
#side-tabs{display:flex;border-bottom:1px solid var(--border)}
.side-tab{flex:1;text-align:center;padding:9px 0;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.side-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#file-list,#outline-list{flex:1;overflow-y:auto;padding:6px}
#file-list .file-item{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text2)}
#file-list .file-item:hover{background:var(--bg3)}
#file-list .file-item.active{background:var(--accent2);color:var(--accent)}
#file-list .file-item .del{visibility:hidden;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px}
#file-list .file-item:hover .del{visibility:visible}
#file-list .file-item .del:hover{color:#e05555;background:rgba(224,85,85,.12)}
.out-item{padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out-item:hover{background:var(--bg3);color:var(--accent)}
#side-tip{padding:10px;color:var(--muted);font-size:12px;text-align:center}

/* ============ 编辑/预览区 ============ */
#split{flex:1;display:flex;min-width:0;position:relative}
#editor{flex:1;border:none;outline:none;resize:none;background:var(--bg);color:var(--text);font-family:"Cascadia Code","JetBrains Mono",Consolas,"Microsoft YaHei",monospace;font-size:15px;line-height:1.75;padding:24px 26px;caret-color:var(--accent);tab-size:4}
#preview-wrap{flex:1;overflow-y:auto;min-width:0}
#preview{max-width:800px;margin:0 auto;padding:36px 48px 120px}

body.mode-edit #preview-wrap{display:none}
body.mode-read #editor{display:none}
body.mode-live #editor{display:none}
body.mode-live #split-divider{display:none}
#split-divider{width:1px;background:var(--border);flex-shrink:0}

/* 即时渲染模式 */
body.mode-live .live-block{cursor:text;min-height:1em;border-radius:4px}
body.mode-live .live-block:hover{outline:1px dashed var(--border)}
.live-editor{width:100%;border:none;outline:none;background:var(--bg2);color:var(--text);font-family:"Cascadia Code","JetBrains Mono",Consolas,"Microsoft YaHei",monospace;font-size:15px;line-height:1.75;padding:4px 6px;resize:none;overflow:hidden;border-radius:4px}

/* ============ Markdown 渲染样式（Typora github 风） ============ */
.markdown-body{line-height:1.8;color:var(--text);word-wrap:break-word}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{margin:24px 0 16px;font-weight:600;line-height:1.35}
.markdown-body h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.markdown-body h2{font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.markdown-body h3{font-size:1.25em}
.markdown-body h4{font-size:1.05em}
.markdown-body p{margin:0 0 14px}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body img{max-width:100%;height:auto;border-radius:4px;margin:6px 0}
.markdown-body blockquote{border-left:4px solid var(--border);color:var(--muted);padding:2px 16px;margin:0 0 14px}
.markdown-body code{font-family:"Cascadia Code",Consolas,monospace;font-size:.88em;background:var(--bg3);padding:.2em .4em;border-radius:4px}
.markdown-body pre{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 16px}
.markdown-body pre code{background:none;padding:0;font-size:.88em;line-height:1.6}
.markdown-body table{border-collapse:collapse;margin:0 0 16px;display:block;overflow-x:auto;max-width:100%}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:7px 14px}
.markdown-body th{background:var(--bg2)}
.markdown-body tr:nth-child(2n) td{background:var(--bg2)}
.markdown-body hr{border:none;border-top:2px solid var(--border);margin:24px 0}
.markdown-body ul,.markdown-body ol{margin:0 0 14px;padding-left:2em}
.markdown-body li{margin:3px 0}
.markdown-body input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.markdown-body .mermaid{display:flex;justify-content:center;margin:16px 0;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
.markdown-body mark{background:#fff3a3;color:#333;padding:0 3px;border-radius:3px}
body.dark .markdown-body mark{background:#7a6c1f;color:#fff}

/* ============ 状态栏 ============ */
#statusbar{height:26px;border-top:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--muted);gap:22px;flex-shrink:0;user-select:none}
#save-state{color:var(--accent)}

/* ============ 浮动提示 ============ */
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:9px 20px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;font-size:13px;z-index:200;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#drop-mask{position:fixed;inset:0;background:rgba(74,125,240,.15);border:3px dashed var(--accent);display:none;z-index:150;pointer-events:none;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-weight:600}
#drop-mask.show{display:flex}
/* 导出 PDF 时的打印态 */
body.print-pdf{overflow:visible!important;height:auto!important}
body.print-pdf #menubar,body.print-pdf #statusbar,body.print-pdf #sidebar,body.print-pdf #split-divider,body.print-pdf #editor,body.print-pdf #toast,body.print-pdf #drop-mask{display:none!important}
body.print-pdf #split{display:block}
body.print-pdf #preview-wrap{overflow:visible!important}
body.print-pdf #preview{max-width:100%;padding:10mm 8mm}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>

<script>
/* ================= 本机桥接（Electron 下可用） ================= */
const native = window.wwj || null;

/* ================= 初始化 marked / mermaid ================= */
marked.setOptions({
  gfm: true, breaks: true, headerIds: true,
  highlight: (code, lang) => {
    if (lang === 'mermaid') return code;
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, {language: lang}).value;
      return hljs.highlightAuto(code).value;
    } catch(e) { return code; }
  }
});
let mermaidTheme = document.body.classList.contains('dark') ? 'dark' : 'default';
if (window.mermaid) mermaid.initialize({ startOnLoad:false, theme: mermaidTheme, flowchart:{curve:'basis'}, securityLevel:'loose' });

/* ================= 状态 ================= */
let files = JSON.parse(localStorage.getItem('wwj.files') || '[]');
let currentId = localStorage.getItem('wwj.current');
let currentPath = null;   // 外部 .md 文件的真实路径
let focusMode = localStorage.getItem('wwj.focus') === '1';
let typeMode = localStorage.getItem('wwj.type') === '1';
let renderTimer, saveTimer, syncing = false;

function saveMeta(){ localStorage.setItem('wwj.files', JSON.stringify(files)); localStorage.setItem('wwj.current', currentId); }
function cur(){ return files.find(f => f.id === currentId); }

/* ================= 文件管理（内置文档） ================= */
function newFile(name, content){
  const f = { id: 'f' + Date.now() + Math.random().toString(36).slice(2,6), name: name || '未命名', content: content || '', updatedAt: Date.now() };
  files.unshift(f); currentId = f.id; saveMeta(); renderSidebar(); loadInternal(f); return f;
}
function loadInternal(f){
  currentPath = null;
  editor.value = f ? f.content : '';
  document.title = 'wwj — ' + (f ? f.name : '');
  document.getElementById('stat-name').textContent = f ? f.name : '';
  setSaved(); renderPreview(); updateStatus();
}
function loadCurrent(){
  const f = cur();
  currentPath = null;
  editor.value = f ? f.content : '';
  document.title = 'wwj — ' + (f ? f.name : '');
  document.getElementById('stat-name').textContent = f ? f.name : '';
  setSaved(); renderPreview(); updateStatus();
}
function setSaved(){ document.getElementById('save-state').textContent = currentPath ? '已保存' : '已保存'; }
function renderSidebar(){
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  if (!files.length) { list.innerHTML = '<div id="side-tip">暂无文档<br>Ctrl+N 新建</div>'; return; }
  files.forEach(f => {
    const div = document.createElement('div');
    div.className = 'file-item' + (f.id === currentId && !currentPath ? ' active' : '');
    div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(f.name)}</span><button class="del" title="删除">✕</button>`;
    div.onclick = e => {
      if (e.target.classList.contains('del')) { deleteFile(f.id); return; }
      persistCurrent(); currentId = f.id; saveMeta(); renderSidebar(); loadCurrent();
    };
    list.appendChild(div);
  });
}
function deleteFile(id){
  const f = files.find(x => x.id === id);
  if (!f) return;
  if (!confirm(`确定删除「${f.name}」？此操作不可恢复。`)) return;
  files = files.filter(x => x.id !== id);
  if (currentId === id) currentId = files.length ? files[0].id : null;
  saveMeta(); renderSidebar(); loadCurrent();
}
function persistCurrent(){
  if (currentPath) return; // 外部文件走 Ctrl+S 真实保存
  const f = cur();
  if (!f) return;
  f.content = editor.value; f.updatedAt = Date.now(); saveMeta();
}

/* ================= 外部 .md 文件 ================= */
function pushRecent(p, name){
  let rec = JSON.parse(localStorage.getItem('wwj.recent') || '[]');
  rec = rec.filter(r => r.p !== p);
  rec.unshift({ p, name });
  rec = rec.slice(0, 8);
  localStorage.setItem('wwj.recent', JSON.stringify(rec));
  renderRecent();
}
function renderRecent(){
  const box = document.getElementById('recent-box');
  if (!box) return;
  const rec = JSON.parse(localStorage.getItem('wwj.recent') || '[]');
  box.innerHTML = rec.length
    ? '<div class="dd-label">最近打开</div>' +
      rec.map(r => `<div class="dd-item" data-path="${escapeHtml(r.p)}" title="${escapeHtml(r.p)}"><span>🕘 ${escapeHtml(r.name)}</span></div>`).join('') +
      '<div class="dd-sep"></div>'
    : '';
}
document.getElementById('recent-box').addEventListener('click', e => {
  const item = e.target.closest('.dd-item[data-path]');
  if (!item) return;
  e.stopPropagation(); closeMenus();
  openExternal(item.dataset.path);
});

async function openExternal(p){
  try {
    const text = await native.readText(p);
    const name = p.split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
    currentPath = p; currentId = null;
    editor.value = text;
    document.title = 'wwj — ' + name;
    document.getElementById('stat-name').textContent = p;
    document.getElementById('save-state').textContent = '已保存';
    renderSidebar(); renderPreview(); updateStatus();
    pushRecent(p, name);
    toast('已打开 ' + name);
  } catch (err) { toast('打开失败: ' + err.message); }
}

async function saveCurrent(saveAs){
  if (!native) { downloadMd(); return; }
  let p = currentPath;
  if (!p || saveAs) {
    const f = cur();
    p = await native.saveDialog(saveAs || !currentPath ? (f && currentId ? f.name : '未命名') : undefined);
    if (!p) return;
  }
  try {
    await native.writeText(p, editor.value);
    const wasNew = !currentPath;
    currentPath = p;
    const name = p.split(/[\\/]/).pop();
    if (wasNew) pushRecent(p, name.replace(/\.[^.]+$/, ''));
    document.title = 'wwj — ' + name.replace(/\.[^.]+$/, '');
    document.getElementById('stat-name').textContent = p;
    document.getElementById('save-state').textContent = '已保存';
    toast('已保存到 ' + p);
  } catch (err) { toast('保存失败: ' + err.message); }
}

/* ================= 渲染 ================= */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPreview(){
  if (document.body.classList.contains('mode-live')) return renderLive();
  const src = editor.value;
  let html;
  try { html = marked.parse(src); }
  catch(e){ html = '<p style="color:#e05555">渲染出错: ' + escapeHtml(e.message) + '</p>'; }
  // mermaid 代码块 → <div class="mermaid">（innerHTML 解析时自动还原转义）
  html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
    (m, c) => '<div class="mermaid">' + c + '</div>');
  preview.innerHTML = html;
  if (window.mermaid) {
    const nodes = preview.querySelectorAll('.mermaid');
    if (nodes.length) mermaid.run({ nodes: Array.from(nodes) }).catch(()=>{});
  }
  updateOutline();
}

function updateOutline(){
  const out = document.getElementById('outline-list');
  out.innerHTML = '';
  preview.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((h,i) => {
    h.id = h.id || ('h-' + i + '-' + Math.random().toString(36).slice(2,6));
    const div = document.createElement('div');
    div.className = 'out-item';
    div.style.paddingLeft = (8 + (h.tagName[1] - 1) * 14) + 'px';
    div.textContent = h.textContent;
    div.onclick = () => h.scrollIntoView({behavior:'smooth', block:'start'});
    out.appendChild(div);
  });
  if (!out.children.length) out.innerHTML = '<div id="side-tip">在文中使用 # 标题即可生成大纲</div>';
}

function updateStatus(){
  const text = editor.value;
  const cjk = (text.match(/[\u4e00-\u9fff\u3040-\u30ff]/g) || []).length;
  const words = (text.replace(/[\u4e00-\u9fff\u3040-\u30ff]/g,' ').match(/[a-zA-Z0-9_]+/g) || []).length;
  document.getElementById('stat-words').textContent = '字数: ' + (cjk + words);
  const pos = editor.value.slice(0, editor.selectionStart).split('\n');
  document.getElementById('stat-pos').textContent = '行 ' + pos.length + ', 列 ' + (pos[pos.length-1].length + 1);
}

/* ================= 编辑器事件 ================= */
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('preview-wrap');

editor.addEventListener('input', () => {
  document.getElementById('save-state').textContent = currentPath ? '未保存（Ctrl+S 保存到文件）' : '编辑中…';
  clearTimeout(renderTimer);

function refreshFocus(){
  if (!focusMode) return;
  const blocks = preview.children;
  if (!blocks.length) return;
  const wrapRect = previewWrap.getBoundingClientRect();
  const center = wrapRect.top + wrapRect.height / 2;
  let best = null, bestD = Infinity;
  for (const el of blocks) {
    const r = el.getBoundingClientRect();
    const d = Math.abs(r.top + r.height / 2 - center);
    if (d < bestD) { bestD = d; best = el; }
  }
  for (const el of blocks) el.classList.toggle('focus-hl', el === best);
}
function toggleFocus(){
  focusMode = !focusMode;
  localStorage.setItem('wwj.focus', focusMode ? '1' : '');
  document.body.classList.toggle('focus-mode', focusMode);

  toast(focusMode ? '专注模式：已开启（当前段落高亮）' : '专注模式：已关闭');
}
function typewriter(){
  if (!typeMode) return;
  const lh = parseFloat(getComputedStyle(editor).lineHeight) || 26;
  const line = editor.value.slice(0, editor.selectionStart).split('\n').length - 1;
  const target = line * lh - editor.clientHeight / 2 + lh / 2;

/* ================= 即时渲染模式（单栏所见即所得） ================= */
let liveBlocks = [];

function splitSourceBlocks(src){
  const lines = src.split('\n');
  const raw = [];
  let cur = [], inFence = false;
  const listRe = /^\s*(?:[-*+]|\d+[.)])\s/;
  for (const line of lines) {
    if (/^\s*(```|~~~)/.test(line)) { inFence = !inFence; cur.push(line); continue; }
    if (!inFence && line.trim() === '') {
      if (cur.length) { raw.push(cur.join('\n')); cur = []; }
      continue;
    }
    cur.push(line);
  }
  if (cur.length) raw.push(cur.join('\n'));
  // 相邻列表块合并（避免空行打断有序列表编号）
  const merged = [];
  for (const b of raw) {
    const prev = merged[merged.length - 1];
    if (prev && listRe.test(prev) && listRe.test(b)) merged[merged.length - 1] = prev + '\n\n' + b;
    else merged.push(b);
  }
  return merged;
}

function renderMath(el){
  if (window.renderMathInElement) {
    try {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false}
        ],
        ignoredTags: ['script','noscript','style','textarea','pre','code'],
        throwOnError: false
      });
    } catch(e) {}
  }
}

function renderLive(){
  liveBlocks = splitSourceBlocks(editor.value);
  preview.innerHTML = liveBlocks.map((b, i) => {
    let html;
    try { html = marked.parse(b); }
    catch(e){ html = '<p style="color:#e05555">渲染出错</p>'; }
    html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
      (m, c) => '<div class="mermaid">' + c + '</div>');
    return '<div class="live-block" data-i="' + i + '">' + html + '</div>';
  }).join('');
  if (window.mermaid) {
    const nodes = preview.querySelectorAll('.mermaid');
    if (nodes.length) mermaid.run({ nodes: Array.from(nodes) }).catch(()=>{});
  }
  renderMath(preview);
  updateOutline();
}

function autosizeTa(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function wrapInTa(el, before, after){
  const s = el.selectionStart, e = el.selectionEnd;
  const sel = el.value.slice(s, e) || '文字';
  el.value = el.value.slice(0, s) + before + sel + after + el.value.slice(e);
  el.selectionStart = s + before.length;
  el.selectionEnd = s + before.length + sel.length;
  el.dispatchEvent(new Event('input'));
}

preview.addEventListener('click', e => {
  if (!document.body.classList.contains('mode-live')) return;
  const block = e.target.closest('.live-block');
  if (!block || block.querySelector('.live-editor')) return;
  const i = +block.dataset.i;
  const ta = document.createElement('textarea');
  ta.className = 'live-editor';
  ta.value = liveBlocks[i];
  ta.rows = 1;
  block.innerHTML = '';
  block.appendChild(ta);
  autosizeTa(ta);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  ta.addEventListener('input', () => autosizeTa(ta));
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); ta.dataset.cancel = '1'; ta.blur(); }
    else if (ev.key === 'Enter' && ev.ctrlKey) { ev.preventDefault(); ta.blur(); }
    else if (ev.key === 'Tab') { ev.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; }
    else if (ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
      const k = ev.key.toLowerCase();
      if (k === 'b') { ev.preventDefault(); wrapInTa(ta, '**', '**'); }
      else if (k === 'i') { ev.preventDefault(); wrapInTa(ta, '*', '*'); }
      else if (k === 's') { ev.preventDefault(); saveCurrent(false); }
    }
  });
  ta.addEventListener('blur', () => {
    if (!ta.dataset.cancel) liveBlocks[i] = ta.value;
    editor.value = liveBlocks.join('\n');
    editor.dispatchEvent(new Event('input'));
  });
});

function insertAtCursor(text){
  const s = editor.selectionStart, e = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + text + editor.value.slice(e);
  editor.selectionStart = editor.selectionEnd = s + text.length;
  editor.focus();
}
function wrapSel(before, after, placeholder){
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e) || placeholder || '';
  editor.value = editor.value.slice(0, s) + before + sel + after + editor.value.slice(e);
  editor.selectionStart = s + before.length;
  editor.selectionEnd = s + before.length + sel.length;
  editor.focus();
  editor.dispatchEvent(new Event('input'));
}

async function doAction(act){
  switch(act){
    case 'new': persistCurrent(); newFile(); toast('已新建文档'); break;
    case 'open':
      if (native) { const p = await native.openDialog(); if (p) openExternal(p); }
      else document.getElementById('md-picker').click();
      break;
    case 'save': saveCurrent(false); break;
    case 'saveas': saveCurrent(true); break;
    case 'export': exportHtml(); break;
    case 'rename': {
      if (currentPath) { toast('外部文件请在资源管理器中重命名'); return; }
      const f = cur(); if (!f) return;
      const n = prompt('重命名文档：', f.name);
      if (n) { f.name = n.trim(); saveMeta(); renderSidebar(); loadCurrent(); }
      break;
    }
    case 'del': { if (currentPath) { toast('外部文件请在侧边栏选择内置文档管理'); return; } const f = cur(); if (f) deleteFile(f.id); break; }
    case 'img': document.getElementById('img-picker').click(); break;
    case 'table': insertAtCursor('\n| 表头1 | 表头2 | 表头3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n'); editor.dispatchEvent(new Event('input')); break;
    case 'mermaid': insertAtCursor('\n```mermaid\ngraph TD\n    A[开始] --> B{条件判断}\n    B -->|是| C[执行操作]\n    B -->|否| D[结束]\n    C --> D\n```\n'); editor.dispatchEvent(new Event('input')); break;
    case 'code': insertAtCursor('\n```python\nprint("hello wwj")\n```\n'); editor.dispatchEvent(new Event('input')); break;
    case 'link': wrapSel('[', '](https://)', '链接文字'); break;
    case 'theme-light': setTheme(false); break;
    case 'theme-dark': setTheme(true); break;
    case 'zoomreset': uiZoom = 100; applyZoom(); break;
    case 'loadcss': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.css,text/css';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        f.text().then(css => {
          css = css.slice(0, 512 * 1024);
          localStorage.setItem('wwj.customcss', css);
          applyCustomCSS(css);
          toast('自定义 CSS 已应用：' + f.name);
        }).catch(err => toast('读取失败: ' + err.message));
      };
      inp.click();
      break;
    }
    case 'clearcss': localStorage.removeItem('wwj.customcss'); applyCustomCSS(''); toast('已恢复默认样式'); break;
    case 'focus': toggleFocus(); break;
    case 'typewriter': toggleType(); break;
    case 'sample': persistCurrent(); newFile('示例文档', SAMPLE); break;
    case 'about': alert('wwj v1.4 — Typora 风格 Markdown 编辑器\n\n· 三种模式：编辑双栏 / 即时渲染单栏（点击段落编辑）/ 阅读\n· Mermaid 流程图 / 时序图 / 甘特图\n· KaTeX 数学公式（$...$ 与 $$...$$）\n· 图片粘贴/拖拽/选择 → 自动 base64 内嵌，无大小限制\n· 双击 .md 文件可直接用 wwj 打开并真实保存\n· 最近打开 · 专注模式(F8) · 打字机模式(F9)\n· 导出 PDF / HTML · 明暗主题 · 大纲导航\n· Ctrl+滚轮缩放页面（50%-300%，Ctrl+0 重置）'); break;
  }
}

function downloadMd(){

async function exportPdf(){

function exportHtml(){
  renderPreview();
  const f = cur();
  const name = currentPath ? document.title.replace('wwj — ','') : (f ? f.name : '未命名');
  const dark = document.body.classList.contains('dark');
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const bodyCls = dark ? ' class="dark"' : '';
  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${escapeHtml(name)}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${dark?'github-dark':'github'}.min.css">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"><\/script>
<style>${css}#menubar,#statusbar,#sidebar,#split-divider,#editor,#toast,#drop-mask{display:none!important}
#split{display:block}#preview-wrap{overflow:visible}body{overflow:auto;height:auto}</style></head>
<body${bodyCls}><div id="preview-wrap"><div id="preview" class="markdown-body">${preview.innerHTML}</div></div>
<script>if(window.mermaid){mermaid.initialize({startOnLoad:true,theme:'${dark?'dark':'default'}'});}
if(window.renderMathInElement){renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}<\/script>
</body></html>`;
  if (native) {
    (async () => {
      const p = await native.saveDialog(name + '.html');
      if (!p) return;
      await native.writeText(p, doc);
      toast('已导出 ' + p);
    })();
  } else {
    const blob = new Blob([doc], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '.html'; a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出 ' + name + '.html');
  }
}

let uiZoom = parseInt(localStorage.getItem('wwj.zoom'), 10) || 100;
let zoomToastTimer;
function applyZoom(save){
  uiZoom = Math.max(50, Math.min(300, uiZoom));
  document.body.style.zoom = uiZoom / 100;
  if (save === false) return;
  localStorage.setItem('wwj.zoom', String(uiZoom));
  clearTimeout(zoomToastTimer);
  zoomToastTimer = setTimeout(() => toast('页面缩放: ' + uiZoom + '%（Ctrl+滚轮 / Ctrl+= / Ctrl+- / Ctrl+0 重置）'), 300);
}
window.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  uiZoom += e.deltaY < 0 ? 10 : -10;
  applyZoom();
}, { passive: false, capture: true });
if (native && native.onZoomStep) native.onZoomStep(step => { uiZoom += step; applyZoom(); });
window.addEventListener('keydown', e => {
  if (!e.ctrlKey || e.shiftKey || e.altKey) return;
  const k = e.key;
  if (k === '=' || k === '+') { e.preventDefault(); uiZoom += 10; applyZoom(); }
  else if (k === '-') { e.preventDefault(); uiZoom -= 10; applyZoom(); }
  else if (k === '0') { e.preventDefault(); uiZoom = 100; applyZoom(); }
});

/* ================= 自定义 CSS 主题 ================= */
function applyCustomCSS(css){
  let el = document.getElementById('custom-css-style');
  if (!el) { el = document.createElement('style'); el.id = 'custom-css-style'; document.head.appendChild(el); }
  el.textContent = css || '';
}

/* ================= 启动 ================= */
if (native) native.onOpenFile(openExternal);
if (localStorage.getItem('wwj.dark') === '1') setTheme(true);
if (focusMode) { document.body.classList.add('focus-mode'); }
refreshMenuChecks();
renderRecent();
applyCustomCSS(localStorage.getItem('wwj.customcss') || '');
applyZoom(false);
applyMode(localStorage.getItem('wwj.mode') || 'mode-split');
if (!files.length) newFile('欢迎使用 wwj', SAMPLE);
else { if (!cur()) currentId = files[0].id; renderSidebar(); loadCurrent(); }
</script>
</body>
